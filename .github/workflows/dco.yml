name: dco
on:
  pull_request:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar Signed-off-by em todo commit do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # commit inicial (só LICENSE), anterior à regra de DCO
          EXEMPT: ed19550d6450057118a45e81b3a27f37695e70a0
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            [ "$sha" = "$EXEMPT" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit $sha sem Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
