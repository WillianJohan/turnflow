appId: io.github.willianjohan.turnflow
productName: Turnflow
directories:
  buildResources: build
# Lista do que entra (as dependências de produção o electron-builder junta sozinho). Por exclusão,
# out-test/, e2e/, scripts/ e notas de trabalho iam parar no asar; `npm run check-package` confere.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
  - LICENSE
  - NOTICE
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3-multiple-ciphers/**
win:
  executableName: turnflow
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Willian Johan
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
